# Verifica cloud dello streamer: esegue cloud-stream.sh in una VM Ubuntu isolata
# (Xvfb + PulseAudio + Chromium + FFmpeg), registra il combattimento su file invece
# che su RTMP e controlla con ffprobe video 1080p60 e audio del gioco.
# Non trasmette verso YouTube/X e non usa secret: è un test, non una diretta.
name: Cloud stream dry-run

on:
  workflow_dispatch:
    inputs:
      max_wait_sec:
        description: Attesa massima del combattimento (secondi)
        default: '1200'
      duration_sec:
        description: Durata della registrazione (secondi)
        default: '15'
  push:
    branches: [main]
    paths:
      - cloud-stream.sh
      - .github/workflows/cloud-stream.yml

permissions:
  contents: read

concurrency:
  group: cloud-stream-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_STATE_ORIGIN: https://bt-3-market-arena.vercel.app
      STREAM_RTMP_URL: artifacts/dryrun-primary.flv
      STREAM_RTMP_URL_SECONDARY: artifacts/dryrun-secondary.flv
      STREAM_WAIT_FOR_FIGHTING: '1'
      STREAM_START_DELAY_SEC: ${{ inputs.max_wait_sec || '1200' }}
      STREAM_DURATION_SEC: ${{ inputs.duration_sec || '15' }}
      STATE_FILE: ''
      LAUNCHER_LOG: artifacts/launcher.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb pulseaudio ffmpeg
          npx playwright install --with-deps chromium

      - name: Run cloud-stream.sh until combat, record to files
        run: |
          mkdir -p artifacts/frames
          chmod +x cloud-stream.sh
          # Diagnostica: un fotogramma ridotto di :99 ogni 4 s, nominato con i secondi trascorsi.
          ( start=$(date +%s); while true; do
              if [ -S /tmp/.X11-unix/X99 ]; then
                ffmpeg -v error -y -f x11grab -video_size 1920x1080 -i :99.0 -frames:v 1 -vf scale=320:180 -q:v 7 \
                  "artifacts/frames/$(printf %04d $(( $(date +%s) - start ))).jpg" || true
              fi
              sleep 4
            done ) &
          grabber=$!
          status=0
          ./cloud-stream.sh > >(tee artifacts/cloud-stream.log) 2>&1 || status=$?
          kill "$grabber" 2>/dev/null || true
          exit "$status"

      - name: Publish diagnostic frames
        if: failure()
        run: |
          # Le annotazioni sono pubbliche: gli ultimi fotogrammi in base64 per la diagnosi.
          for frame in $(ls artifacts/frames/*.jpg 2>/dev/null | tail -n 10); do
            echo "::notice title=frame $(basename "$frame" .jpg)s::$(base64 -w0 "$frame")"
          done

      - name: Verify 1080p60 video and game audio
        run: |
          set -euo pipefail
          for file in "$STREAM_RTMP_URL" "$STREAM_RTMP_URL_SECONDARY"; do
            echo "== $file"
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,sample_rate,channels:format=duration -of default=nw=1 "$file" | tee "$file.probe.txt"
            grep -qx 'codec_name=h264' "$file.probe.txt"
            grep -qx 'width=1920' "$file.probe.txt"
            grep -qx 'height=1080' "$file.probe.txt"
            grep -qx 'avg_frame_rate=60/1' "$file.probe.txt"
            grep -qx 'codec_name=aac' "$file.probe.txt"
          done
          ffmpeg -hide_banner -nostats -i "$STREAM_RTMP_URL" -map 0:a -af volumedetect -f null - 2> artifacts/volume.txt
          grep -E 'mean_volume|max_volume' artifacts/volume.txt | tee artifacts/volume-summary.txt
          max=$(sed -n 's/.*max_volume: \(-\?[0-9.]*\) dB/\1/p' artifacts/volume.txt)
          awk -v m="$max" 'BEGIN { exit !(m > -60) }' || { echo "Audio muto: max_volume ${max} dB"; exit 1; }
          ffmpeg -hide_banner -v error -y -ss 7 -i "$STREAM_RTMP_URL" -frames:v 1 artifacts/dryrun-frame.png

      - name: Compare with the in-page web automation
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          BT3_SMOKE_HEADFUL=1 BT3_SMOKE_BASE_URL=https://bt-3-market-arena.vercel.app BT3_SMOKE_TIMEOUT=900000 \
            xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/smokeWeb.mjs --full 2>&1 | tee artifacts/web-smoke.log
        timeout-minutes: 20

      - name: Unit tests on Linux
        if: always()
        continue-on-error: true
        run: npm test

      - name: Summary
        if: always()
        # Il riepilogo è pubblico anche senza accesso ai log: nel dry-run le destinazioni
        # sono file locali, quindi il log non contiene stream key.
        run: |
          {
            echo '## Cloud stream dry-run'
            echo '### Ultime righe di cloud-stream.sh'
            tail -n 40 artifacts/cloud-stream.log 2>/dev/null | sed 's/^/    /'
            for f in artifacts/*.probe.txt; do
              if [ -f "$f" ]; then echo "### $(basename "$f" .probe.txt)"; sed 's/^/    /' "$f"; fi
            done
            if [ -f artifacts/volume-summary.txt ]; then echo '### Audio'; sed 's/^/    /' artifacts/volume-summary.txt; fi
          } >> "$GITHUB_STEP_SUMMARY" || true
          # Le annotazioni sono leggibili anche dall'API pubblica, a differenza di log e summary.
          tail_text=$(tail -n 30 artifacts/cloud-stream.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=cloud-stream.sh tail::${tail_text}"
          web_text=$(grep -E 'BT3 menu|BT3 phase|"(status|menuSequence|phase|renderer|labSpeed|presentFps)"' artifacts/web-smoke.log 2>/dev/null | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=web smoke tail::${web_text}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-stream-dry-run
          path: |
            artifacts/dryrun-primary.flv
            artifacts/dryrun-secondary.flv
            artifacts/dryrun-frame.png
            artifacts/dragonballbt3-*.png
            artifacts/*.log
            artifacts/*.txt
          if-no-files-found: warn
          retention-days: 7
