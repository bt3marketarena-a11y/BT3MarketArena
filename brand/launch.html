<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #04060b; font-family: "Segoe UI", Inter, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background: url(launch-bg.jpg) center / cover; filter: saturate(1.15) contrast(1.05); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(4,6,11,.94) 0%, rgba(4,6,11,.82) 34%, rgba(4,6,11,.25) 62%, rgba(4,6,11,.05) 100%),
    linear-gradient(0deg, rgba(4,6,11,.85) 0%, transparent 35%); }
  .rays { position: absolute; left: 300px; top: 420px; width: 1800px; height: 1800px; translate: -50% -50%; opacity: .55;
    background: repeating-conic-gradient(from 0deg, rgba(255,160,40,.18) 0 2deg, transparent 2deg 9deg, rgba(95,176,255,.12) 9deg 10.5deg, transparent 10.5deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 5%, transparent 34%); }
  .top { position: absolute; left: 80px; right: 80px; top: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font: 600 22px/1 "Segoe UI"; letter-spacing: .26em; }
  .brand img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.2), 0 0 30px rgba(255,140,30,.5); }
  .live { display: inline-flex; margin-bottom: 26px; align-items: center; gap: 12px; padding: 12px 20px; border: 2px solid rgba(255,61,94,.7); border-radius: 999px; background: rgba(255,61,94,.15);
    font: 800 20px/1 Consolas, monospace; letter-spacing: .2em; color: #ffd0d8; }
  .live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #ff3d5e; box-shadow: 0 0 14px #ff3d5e; }
  .copy { position: absolute; left: 80px; bottom: 80px; width: 820px; }
  .bt3 { display: block; font: italic 900 210px/.86 "Segoe UI Black", "Segoe UI"; letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff7d1 0%, #ffd23f 32%, #ff8a1f 68%, #e2410c 100%); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 0 36px rgba(255,140,30,.6)); }
  h1 { margin: 6px 0 0; font: 900 92px/.95 "Segoe UI Black", "Segoe UI"; letter-spacing: -.02em; text-transform: uppercase; }
  h1 span { color: transparent; -webkit-text-stroke: 2.5px rgba(255,255,255,.92); }
  .tag { margin-top: 30px; font: 700 36px/1.25 "Segoe UI"; }
  .g { color: #2cf29b; } .r { color: #ff3d5e; }
  .bar { margin-top: 30px; width: 640px; height: 14px; border-radius: 999px; background: linear-gradient(90deg, #12b36c, #2cf29b 50%, #ff3d5e 50%, #c81e3e); box-shadow: 0 0 30px rgba(44,242,155,.35); }
  .url { margin-top: 30px; display: flex; align-items: center; gap: 14px; font: 700 32px/1 Consolas, monospace; letter-spacing: .04em; }
  .url::before { content: ""; border-left: 20px solid #ffc23a; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
</style></head><body>
  <div class="bg"></div><div class="rays"></div><div class="shade"></div>
  <div class="top">
    <div class="brand"><img src="bt3-logo.png" alt=""><span>BT3 MARKET ARENA</span></div>
  </div>
  <div class="copy">
    <div class="live">LIVE 24/7 ON KICK</div>
    <span class="bt3">BT3</span>
    <h1>Market <span>Arena</span></h1>
    <div class="tag"><span class="g">BUY</span> powers P1 &middot; <span class="r">SELL</span> powers P2</div>
    <div class="bar"></div>
    <div class="url">bt3marketarena.xyz</div>
  </div>
</body></html>
