<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BT3 Market Arena // Cloud Admin</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080d13;color:#e7edf3}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:620px;margin:auto}h1{margin:4px 0 8px}small{color:#35f2a0;letter-spacing:2px}p{color:#93a2b1;line-height:1.5}form{display:grid;gap:15px;margin-top:24px}label{display:grid;gap:6px;color:#afbdca;font-size:13px}input,select,button{font:inherit;padding:12px;border-radius:5px}input,select{border:1px solid #304151;background:#101822;color:#edf4fa}button{border:0;background:#35f2a0;color:#06120d;font-weight:800;cursor:pointer}output{min-height:24px;color:#35f2a0}output.error{color:#ff7188}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <small>DIRECT CONTROL ROOM</small>
  <h1>Market Arena Cloud</h1>
  <p>Il Contract Address aggiornato viene distribuito via SSE a tutti gli spettatori e allo streamer. La password viene usata solo per questa richiesta e non viene salvata.</p>
  <form id="admin-form">
    <label>Sorgente mercato<select name="source"><option value="simulation">Simulazione pre-lancio</option><option value="pumpportal">PumpPortal</option><option value="dexscreener">DexScreener</option><option value="solana">Solana RPC</option></select></label>
    <label>Contract Address / Mint<input name="ca" autocomplete="off" spellcheck="false"></label>
    <label>Whale threshold (USD)<input name="whaleThreshold" type="number" min="1" value="10000"></label>
    <div class="grid"><label>WebSocket RPC<input name="wsUrl"></label><label>HTTP RPC<input name="httpUrl"></label></div>
    <div class="grid"><label>Fase offset<input name="phaseOffset" type="number" min="0"></label><label>Durata fallback (secondi)<input name="roundDurationSec" type="number" min="10" value="300"></label></div>
    <div class="grid"><label>HP P1 offset<input name="hp1Offset" type="number" min="0"></label><label>HP P2 offset<input name="hp2Offset" type="number" min="0"></label></div>
    <label>ADMIN_KEY<input name="adminKey" type="password" autocomplete="off" required></label>
    <button type="submit">Aggiorna tutti i client</button>
    <output id="output" aria-live="polite"></output>
  </form>
</main>
<script>
const form = document.getElementById('admin-form');
const output = document.getElementById('output');
function fill(state) {
  for (const [key, value] of Object.entries(state)) {
    if (form.elements[key] && key !== 'adminKey' && value !== null) form.elements[key].value = value;
  }
}
async function load() {
  const response = await fetch('/api/state', { cache: 'no-store' });
  if (!response.ok) throw new Error(`Stato HTTP ${response.status}`);
  fill(await response.json());
}
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  output.className = '';
  output.value = 'Aggiornamento…';
  const values = Object.fromEntries(new FormData(form).entries());
  const adminKey = values.adminKey;
  delete values.adminKey;
  try {
    const response = await fetch('/api/state', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminKey}` },
      body: JSON.stringify(values),
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error ?? `HTTP ${response.status}`);
    fill(payload);
    form.elements.adminKey.value = '';
    output.value = `Revisione ${payload.revision} distribuita a tutti i client.`;
  } catch (error) {
    output.className = 'error';
    output.value = error.message;
  }
});
const events = new EventSource('/api/events');
events.addEventListener('state', (event) => fill(JSON.parse(event.data)));
load().catch((error) => { output.className = 'error'; output.value = error.message; });
</script>
</body>
</html>
